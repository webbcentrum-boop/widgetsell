<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WidgetSell · Kundportal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #0f172a;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 28px 24px;
    }
    .header-inner {
      max-width: 760px;
      margin: 0 auto;
    }
    .brand {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 10px;
    }
    .client-name {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }
    .header-sub {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }

    /* ── Main ───────────────────────────────── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 16px;
    }

    /* ── Report cards ───────────────────────── */
    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .report-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 22px 24px;
      transition: box-shadow .15s, border-color .15s;
      cursor: default;
    }
    .report-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      border-color: #cbd5e1;
    }

    .card-month {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
    }

    .card-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-item {
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .card-btn {
      display: block;
      background: #0f172a;
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background .15s;
    }
    .card-btn:hover { background: #1e293b; }

    .card-date {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
    }

    /* ── Empty / Loading ────────────────────── */
    .state {
      text-align: center;
      padding: 64px 24px;
      color: #94a3b8;
    }
    .state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .state-title {
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
    }
    .state-sub {
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ─────────────────────────────── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #cbd5e1;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">WidgetSell · Kundportal</div>
    <div class="client-name" id="client-name">Laddar…</div>
    <div class="header-sub">Dina månadsrapporter</div>
  </div>
</div>

<div class="main">
  <div id="root">
    <div class="state"><div class="spinner"></div></div>
  </div>
</div>

<footer>WidgetSell &nbsp;·&nbsp; Rappporter genereras den 1:a varje månad</footer>

<script>
  // Extract clientToken from URL: /portal/{clientToken}
  const pathParts   = window.location.pathname.split('/').filter(Boolean);
  const clientToken = pathParts[pathParts.length - 1];
  const root        = document.getElementById('root');
  const clientNameEl = document.getElementById('client-name');

  const MONTH_NAMES = [
    'Januari','Februari','Mars','April','Maj','Juni',
    'Juli','Augusti','September','Oktober','November','December',
  ];

  function monthLabel(monthYear) {
    const [y, m] = monthYear.split('-').map(Number);
    return `${MONTH_NAMES[m - 1]} ${y}`;
  }

  function delta(curr, prev) {
    if (curr == null || prev == null) return '';
    const d = curr - prev;
    if (d === 0) return '';
    const color = d > 0 ? '#16a34a' : '#dc2626';
    const sign  = d > 0 ? '+' : '';
    return `<span style="font-size:10px;color:${color};display:block;margin-top:2px">${sign}${d}</span>`;
  }

  function renderCard(report) {
    const s       = report.stats || {};
    const label   = report.monthLabel || monthLabel(report.month_year);
    const viewUrl = `/api/portal/${clientToken}/reports/${report.month_year}`;
    const genDate = report.generated_at
      ? new Date(report.generated_at).toLocaleDateString('sv-SE')
      : '';

    return `
      <div class="report-card">
        <div class="card-month">${label}</div>
        <div class="card-stats">
          <div class="stat-item">
            <div class="stat-value">${s.conversations ?? '—'}</div>
            ${delta(s.conversations, s.prevConversations)}
            <div class="stat-label">Konversationer</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">${s.leads ?? '—'}</div>
            ${delta(s.leads, s.prevLeads)}
            <div class="stat-label">Leads</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">${s.bookings ?? '—'}</div>
            ${delta(s.bookings, s.prevBookings)}
            <div class="stat-label">Bokningar</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">${s.conversionRate != null ? s.conversionRate + '%' : '—'}</div>
            <div class="stat-label">Konvertering</div>
          </div>
        </div>
        <a class="card-btn" href="${viewUrl}" target="_blank" rel="noopener">Visa fullständig rapport →</a>
        ${genDate ? `<div class="card-date">Genererad ${genDate}</div>` : ''}
      </div>`;
  }

  async function load() {
    if (!clientToken || clientToken === 'portal') {
      root.innerHTML = `<div class="state">
        <div class="state-icon">🔒</div>
        <div class="state-title">Ingen portal-länk</div>
        <div class="state-sub">Kontakta WidgetSell för att få din portal-länk.</div>
      </div>`;
      return;
    }

    try {
      const res  = await fetch(`/api/portal/${clientToken}/reports`);
      if (!res.ok) throw new Error(`${res.status}`);
      const data = await res.json();

      clientNameEl.textContent = data.clientName || 'Kundportal';
      document.title = `${data.clientName || 'Portal'} · WidgetSell`;

      if (!data.reports || data.reports.length === 0) {
        root.innerHTML = `<div class="state">
          <div class="state-icon">📭</div>
          <div class="state-title">Inga rapporter ännu</div>
          <div class="state-sub">Din första rapport genereras den 1:a nästa månad.</div>
        </div>`;
        return;
      }

      root.innerHTML = `
        <p class="section-title">${data.reports.length} rapport${data.reports.length !== 1 ? 'er' : ''}</p>
        <div class="reports-grid">
          ${data.reports.map(renderCard).join('')}
        </div>`;

    } catch (e) {
      root.innerHTML = `<div class="state">
        <div class="state-icon">⚠️</div>
        <div class="state-title">Kunde inte ladda rapporter</div>
        <div class="state-sub">Kontrollera din länk eller kontakta WidgetSell.<br><small style="opacity:.6">${e.message}</small></div>
      </div>`;
    }
  }

  load();
</script>
</body>
</html>
