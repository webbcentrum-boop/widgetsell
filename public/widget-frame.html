<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WidgetSell</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

    .shell { height: 100%; display: flex; flex-direction: column; background: #fff; position: relative; }

    /* ── Screens ── */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ── Header ── */
    .header {
      padding: 15px 18px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #e8f5ee;
      flex-shrink: 0;
    }
    .brand { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #a3b8aa; }
    .brand span {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .icon-btn {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid #e2ece6; background: transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #9db8a5; transition: all .15s; padding: 0;
    }
    .icon-btn:hover { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; }

    /* ── Footer ── */
    .footer {
      text-align: center; padding: 8px 0 10px;
      font-size: 10px; color: #b8cdc0; letter-spacing: .04em;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid #e8f5ee; flex-shrink: 0;
    }
    .footer strong { color: #9db8a5; font-weight: 600; }
    .footer a { color: #9db8a5; text-decoration: none; font-weight: 600; }
    .footer a:hover { color: #16a34a; }

    /* ── Mode selection screen ── */
    .mode-body {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 22px; gap: 26px;
      background: #fff;
      background-image: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(22,163,74,.06) 0%, transparent 100%);
    }
    .mode-greeting { text-align: center; }
    .mode-greeting .mode-av {
      width: 78px; height: 78px; border-radius: 50%; overflow: hidden;
      border: 2.5px solid #16a34a;
      margin: 0 auto 16px;
      box-shadow: 0 0 0 6px rgba(22,163,74,.08), 0 4px 20px rgba(22,163,74,.18);
    }
    .mode-greeting .mode-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mode-greeting h2 { font-size: 17px; font-weight: 700; color: #14532d; margin-bottom: 6px; letter-spacing: -.01em; }
    .mode-greeting p { font-size: 13px; color: #6b7a70; line-height: 1.55; }
    .mode-cards { display: flex; gap: 10px; width: 100%; }
    .mode-card {
      flex: 1; border: 1.5px solid #e2ece6; border-radius: 18px;
      background: #fff;
      cursor: pointer; padding: 22px 12px;
      display: flex; flex-direction: column; align-items: center; gap: 11px;
      transition: all .22s; position: relative; overflow: hidden;
    }
    .mode-card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(22,163,74,.06) 0%, transparent 60%);
      opacity: 0; transition: opacity .22s; border-radius: inherit;
    }
    .mode-card:hover { border-color: #16a34a; box-shadow: 0 0 0 1px rgba(22,163,74,.15), 0 8px 32px rgba(22,163,74,.1); transform: translateY(-2px); }
    .mode-card:hover::after { opacity: 1; }
    .mode-card:active { transform: scale(.97) translateY(0); }
    .mode-card-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid #bbf7d0;
      display: flex; align-items: center; justify-content: center;
    }
    .mode-card-icon svg { width: 22px; height: 22px; color: #16a34a; }
    .mode-card-title { font-size: 14px; font-weight: 700; color: #14532d; }
    .mode-card-desc { font-size: 11px; color: #6b7a70; text-align: center; line-height: 1.5; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,.8); display: inline-block; animation: pulse-dot 2.5s ease-in-out infinite; }
    @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 5px rgba(34,197,94,.6); } 50% { box-shadow: 0 0 12px rgba(34,197,94,1); } }

    /* ── Voice screen ── */
    .voice-top {
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 24px 12px; flex-shrink: 0;
      background: linear-gradient(180deg, #f0fdf4 0%, #fff 100%);
    }
    .avatar-wrap { position: relative; width: 88px; height: 88px; margin-bottom: 12px; }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%; overflow: hidden;
      border: 2.5px solid #16a34a; position: relative; z-index: 1;
      box-shadow: 0 0 0 5px rgba(22,163,74,.1), 0 6px 20px rgba(22,163,74,.15);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ring { position: absolute; border-radius: 50%; border: 1.5px solid #16a34a; opacity: 0; pointer-events: none; }
    .ring.r1 { inset: -10px; }
    .ring.r2 { inset: -20px; border-width: 1px; }
    .avatar-wrap.speaking .ring.r1 { opacity: .5; animation: rp 1.4s ease-in-out infinite; }
    .avatar-wrap.speaking .ring.r2 { opacity: .2; animation: rp 1.4s ease-in-out infinite .45s; }
    .avatar-wrap.listening .ring.r1 { opacity: .6; border-color: #e11d48; animation: rp .85s ease-in-out infinite; }
    .avatar-wrap.listening .ring.r2 { opacity: .22; border-color: #e11d48; animation: rp .85s ease-in-out infinite .28s; }
    @keyframes rp { 0%,100% { transform:scale(1); opacity:.5; } 50% { transform:scale(1.12); opacity:.08; } }
    .v-name { font-size: 16px; font-weight: 700; color: #14532d; margin-bottom: 3px; letter-spacing: -.01em; }
    .v-sub { font-size: 11px; color: #6b7a70; display: flex; align-items: center; gap: 5px; }
    .v-status { font-size: 11px; margin-top: 10px; min-height: 18px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; transition: color .25s; color: #c4d9cc; }
    .v-status.listening { color: #e11d48; }
    .v-status.thinking  { color: #16a34a; }
    .v-status.speaking  { color: #16a34a; }

    .voice-transcript {
      flex: 1; overflow-y: auto;
      padding: 10px 14px;
      display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth; background: #fff;
    }
    .voice-transcript::-webkit-scrollbar { width: 3px; }
    .voice-transcript::-webkit-scrollbar-thumb { background: #dcfce7; border-radius: 3px; }
    .t-line {
      font-size: 13px; line-height: 1.6;
      padding: 9px 14px; border-radius: 16px;
      max-width: 88%; word-break: break-word;
      animation: rise .22s ease;
    }
    @keyframes rise { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
    .t-line.user {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 12px rgba(22,163,74,.25);
    }
    .t-line.bot {
      background: #f0fdf4; color: #1a3a24;
      border: 1px solid #dcfce7;
      align-self: flex-start; border-bottom-left-radius: 4px;
    }

    .voice-bottom {
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 24px 18px; flex-shrink: 0; gap: 10px;
      background: #fff;
    }
    .mic-btn {
      width: 68px; height: 68px; border-radius: 50%;
      border: none; cursor: pointer;
      background: linear-gradient(135deg, #16a34a, #15803d);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(22,163,74,.4);
      transition: transform .15s, box-shadow .2s;
      flex-shrink: 0;
    }
    .mic-btn:hover:not(:disabled) { transform: scale(1.07); box-shadow: 0 6px 32px rgba(22,163,74,.55); }
    .mic-btn:active:not(:disabled) { transform: scale(.93); }
    .mic-btn.listening {
      background: linear-gradient(135deg, #e11d48, #be123c);
      box-shadow: 0 4px 24px rgba(225,29,72,.45);
      animation: mp 1.1s ease-in-out infinite;
    }
    .mic-btn:disabled { opacity: .25; cursor: default; transform: none !important; animation: none !important; }
    @keyframes mp { 0%,100% { box-shadow: 0 4px 24px rgba(225,29,72,.45); } 50% { box-shadow: 0 4px 40px rgba(225,29,72,.8), 0 0 0 12px rgba(225,29,72,.07); } }
    .mic-btn svg { width: 26px; height: 26px; }
    .v-hint { font-size: 11px; color: #b8cdc0; letter-spacing: .02em; min-height: 15px; }
    .switch-link { background: none; border: none; font-size: 11px; color: #9db8a5; cursor: pointer; padding: 4px 0; letter-spacing: .02em; transition: color .15s; }
    .switch-link:hover { color: #16a34a; }

    /* ── Chat screen ── */
    .chat-header {
      padding: 14px 16px;
      display: flex; align-items: center; gap: 11px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #e8f5ee; flex-shrink: 0;
    }
    .ch-avatar {
      width: 36px; height: 36px; border-radius: 50%; overflow: hidden;
      flex-shrink: 0; border: 2px solid #16a34a;
      box-shadow: 0 0 10px rgba(22,163,74,.25);
    }
    .ch-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ch-info { flex: 1; min-width: 0; }
    .ch-name { font-size: 14px; font-weight: 700; color: #14532d; letter-spacing: -.01em; }
    .ch-sub { font-size: 10.5px; color: #6b7a70; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .messages {
      flex: 1; overflow-y: auto;
      padding: 18px 14px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth; background: #fff;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: #dcfce7; border-radius: 3px; }
    .row { display: flex; gap: 8px; max-width: 88%; animation: rise .22s ease; }
    .row.bot { align-self: flex-start; }
    .row.user { align-self: flex-end; flex-direction: row-reverse; }
    .row-av { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-top: 2px; border: 1.5px solid #bbf7d0; }
    .row-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bubble { padding: 10px 14px; border-radius: 17px; font-size: 13px; line-height: 1.65; word-break: break-word; }
    .row.bot .bubble {
      background: #f0fdf4; color: #1a3a24;
      border: 1px solid #dcfce7; border-bottom-left-radius: 4px;
    }
    .row.user .bubble {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; border-bottom-right-radius: 4px;
      box-shadow: 0 2px 12px rgba(22,163,74,.25);
    }
    .typing-row { display: flex; gap: 8px; align-self: flex-start; animation: rise .22s ease; }
    .typing-bubble {
      background: #f0fdf4; border: 1px solid #dcfce7;
      border-radius: 17px; border-bottom-left-radius: 4px;
      padding: 13px 16px; display: flex; align-items: center; gap: 5px;
    }
    .typing-bubble span { width: 6px; height: 6px; border-radius: 50%; background: #bbf7d0; animation: bp 1.2s infinite; }
    .typing-bubble span:nth-child(2) { animation-delay: .2s; }
    .typing-bubble span:nth-child(3) { animation-delay: .4s; }
    @keyframes bp { 0%,60%,100% { background:#bbf7d0; transform:scale(1); } 30% { background:#16a34a; transform:scale(1.35); } }
    .input-area {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: #fff; border-top: 1px solid #e8f5ee; flex-shrink: 0;
    }
    .input-field {
      flex: 1; border: 1.5px solid #e2ece6; border-radius: 22px;
      padding: 10px 16px; font-size: 13px; font-family: inherit;
      color: #1a3a24; background: #f8fdf9; outline: none;
      transition: border-color .2s, box-shadow .2s; line-height: 1.4;
    }
    .input-field:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.1); background: #fff; }
    .input-field::placeholder { color: #b8cdc0; }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, #16a34a, #15803d);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform .15s, box-shadow .2s;
      box-shadow: 0 2px 10px rgba(22,163,74,.3);
    }
    .send-btn:hover:not(:disabled) { transform: scale(1.1); box-shadow: 0 4px 16px rgba(22,163,74,.5); }
    .send-btn:active:not(:disabled) { transform: scale(.92); }
    .send-btn:disabled { opacity: .2; cursor: default; }
    .send-btn svg { width: 15px; height: 15px; fill: #fff; }
  </style>

  <!-- ── Voice screen — premium white/green ── -->
  <style>
    #screen-voice {
      background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 30%);
    }
    #screen-voice .header {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid #e8f5ee;
    }
    #screen-voice .brand { color: #a3b8aa; }
    #screen-voice .icon-btn { border-color: #e2ece6; color: #9db8a5; background: transparent; }
    #screen-voice .icon-btn:hover { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; }
    #screen-voice .footer {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid #e8f5ee;
      color: #b8cdc0;
    }
    #screen-voice .footer strong { color: #9db8a5; }

    /* ── Orb stage ── */
    .v-stage {
      flex: 0 0 auto;
      display: flex; flex-direction: column; align-items: center;
      padding: 26px 24px 10px;
    }
    .orb-wrap {
      position: relative;
      width: 190px; height: 190px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .orb-aura {
      position: absolute; border-radius: 50%; pointer-events: none;
      opacity: 0; transition: opacity .5s ease;
    }
    .oa1 { width: 152px; height: 152px; background: radial-gradient(circle, rgba(22,163,74,.22) 0%, rgba(22,163,74,.05) 55%, transparent 100%); }
    .oa2 { width: 172px; height: 172px; background: radial-gradient(circle, rgba(22,163,74,.09) 0%, transparent 60%); }
    .oa3 { width: 190px; height: 190px; background: radial-gradient(circle, rgba(22,163,74,.04) 0%, transparent 60%); }

    .orb-body {
      width: 116px; height: 116px; border-radius: 50%;
      background: linear-gradient(145deg, #22c55e 0%, #16a34a 45%, #15803d 100%);
      box-shadow:
        0 0 0 1px rgba(22,163,74,.28),
        0 0 40px rgba(22,163,74,.38),
        0 0 80px rgba(22,163,74,.1),
        0 8px 32px rgba(22,163,74,.2);
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 2;
      cursor: pointer; overflow: hidden;
      transition: background .4s ease, box-shadow .4s ease, transform .15s ease;
      animation: orbMorph 8s ease-in-out infinite;
    }
    .orb-body:active { transform: scale(.95); }
    @keyframes orbMorph {
      0%,100% { border-radius: 50%; }
      20%  { border-radius: 46% 54% 52% 48% / 50% 48% 52% 50%; }
      40%  { border-radius: 54% 46% 48% 52% / 48% 54% 46% 52%; }
      60%  { border-radius: 50% 50% 54% 46% / 54% 46% 50% 50%; }
      80%  { border-radius: 48% 52% 46% 54% / 50% 52% 48% 50%; }
    }
    #waveCanvas { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }

    /* Speaking */
    .orb-wrap.speaking .oa1 { opacity: 1; animation: auraP 1.9s ease-in-out infinite; }
    .orb-wrap.speaking .oa2 { opacity: 1; animation: auraP 1.9s ease-in-out infinite .38s; }
    .orb-wrap.speaking .oa3 { opacity: 1; animation: auraP 1.9s ease-in-out infinite .76s; }
    .orb-wrap.speaking .orb-body {
      box-shadow: 0 0 0 1px rgba(22,163,74,.45), 0 0 55px rgba(22,163,74,.58), 0 0 100px rgba(22,163,74,.18), 0 8px 32px rgba(22,163,74,.25);
    }
    /* Listening */
    .orb-wrap.listening .orb-body {
      background: linear-gradient(145deg, #f43f5e 0%, #e11d48 50%, #be123c 100%);
      box-shadow: 0 0 0 1px rgba(244,63,94,.3), 0 0 42px rgba(244,63,94,.48), 0 0 80px rgba(244,63,94,.12), 0 8px 32px rgba(244,63,94,.18);
    }
    .orb-wrap.listening .oa1 { background: radial-gradient(circle, rgba(244,63,94,.18) 0%, transparent 60%); opacity: 1; animation: auraP .72s ease-in-out infinite; }
    .orb-wrap.listening .oa2 { background: radial-gradient(circle, rgba(244,63,94,.07) 0%, transparent 60%); opacity: 1; animation: auraP .72s ease-in-out infinite .18s; }
    /* Thinking */
    .orb-wrap.thinking .orb-body { animation: orbMorph 8s ease-in-out infinite, orbBlink 1.3s ease-in-out infinite; }

    @keyframes auraP   { 0%,100% { transform:scale(1); opacity:.55; } 50% { transform:scale(1.12); opacity:.15; } }
    @keyframes orbBlink { 0%,100% { opacity:1; } 50% { opacity:.48; } }

    /* Text */
    #screen-voice .v-name { font-size: 18px; font-weight: 700; color: #14532d; letter-spacing: -.02em; margin-bottom: 4px; }
    #screen-voice .v-sub  { font-size: 11px; color: #6b7a70; display: flex; align-items: center; gap: 5px; justify-content: center; }
    #screen-voice .v-status { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; color: #c4d9cc; margin-top: 10px; min-height: 15px; transition: color .3s; }
    #screen-voice .v-status.listening { color: #e11d48; }
    #screen-voice .v-status.thinking  { color: #16a34a; }
    #screen-voice .v-status.speaking  { color: #16a34a; }

    /* Transcript */
    #screen-voice .voice-transcript { background: transparent; }
    #screen-voice .voice-transcript::-webkit-scrollbar-thumb { background: #dcfce7; }
    #screen-voice .t-line.user { background: linear-gradient(135deg,#16a34a,#15803d); color:#fff; border:none; box-shadow:0 2px 12px rgba(22,163,74,.22); }
    #screen-voice .t-line.bot  { background: #f0fdf4; color: #1a3a24; border: 1px solid #dcfce7; box-shadow: none; }

    /* Controls */
    .v-controls { display:flex; flex-direction:column; align-items:center; padding:8px 24px 14px; gap:9px; flex-shrink:0; }
    #screen-voice .v-hint      { font-size:11px; color:#b8cdc0; letter-spacing:.02em; min-height:15px; }
    #screen-voice .switch-link { font-size:11px; color:#9db8a5; background:none; border:none; cursor:pointer; padding:4px 0; letter-spacing:.02em; transition:color .15s; }
    #screen-voice .switch-link:hover { color:#16a34a; }
  </style>
</head>
<body>
<div class="shell">

  <!-- ── Mode selection screen ── -->
  <div id="screen-mode" class="screen active">
    <div class="header">
      <span class="brand">Widget<span>Sell</span></span>
      <button class="icon-btn" id="closeMode">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="mode-body">
      <div class="mode-greeting">
        <div class="mode-av"><img src="/victoria.jpg" alt="Victoria"></div>
        <h2>Hej! Jag är Victoria</h2>
        <p>AI säljare på WidgetSell.<br>Hur vill du prata med mig?</p>
      </div>
      <div class="mode-cards">
        <button class="mode-card" id="pickChat">
          <div class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          </div>
          <div class="mode-card-title">Chat</div>
          <div class="mode-card-desc">Skriv ditt meddelande</div>
        </button>
        <button class="mode-card" id="pickVoice">
          <div class="mode-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="1" width="6" height="12" rx="3" fill="currentColor" stroke="none"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8"  y1="23" x2="16" y2="23"/>
            </svg>
          </div>
          <div class="mode-card-title">Röst</div>
          <div class="mode-card-desc">Prata direkt med Victoria</div>
        </button>
      </div>
    </div>
    <div class="footer">Powered by <strong>WidgetSell</strong></div>
  </div>

  <!-- ── Voice screen ── -->
  <div id="screen-voice" class="screen">
    <div class="header">
      <span class="brand">Widget<span>Sell</span></span>
      <button class="icon-btn" id="closeVoice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="v-stage">
      <div class="orb-wrap" id="orbWrap">
        <div class="orb-aura oa3"></div>
        <div class="orb-aura oa2"></div>
        <div class="orb-aura oa1"></div>
        <div class="orb-body" id="micBtn">
          <canvas id="waveCanvas" width="116" height="116"></canvas>
          <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;position:relative;z-index:1;flex-shrink:0;transition:opacity .3s">
            <rect x="9" y="1" width="6" height="12" rx="3" fill="rgba(255,255,255,.85)" stroke="none"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8"  y1="23" x2="16" y2="23"/>
          </svg>
        </div>
      </div>
      <div class="v-name">Victoria</div>
      <div class="v-sub"><span class="dot"></span>AI Sales &bull; Online</div>
      <div class="v-status" id="vStatus"></div>
    </div>

    <div class="voice-transcript" id="transcript"></div>

    <div class="v-controls">
      <div class="v-hint" id="vHint"></div>
      <button class="switch-link" id="toChat">Byt till chat</button>
    </div>
    <div class="footer">Powered by <strong>WidgetSell</strong></div>
  </div>

  <!-- ── Chat screen ── -->
  <div id="screen-chat" class="screen">
    <div class="chat-header">
      <div class="ch-avatar"><img src="/victoria.jpg" alt="Victoria"></div>
      <div class="ch-info">
        <div class="ch-name">Victoria</div>
        <div class="ch-sub"><div class="dot"></div>AI Sales &bull; Online</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="icon-btn" id="closeChat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input class="input-field" id="chatInput" type="text" placeholder="Skriv ett meddelande…" autocomplete="off"/>
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="footer" style="display:flex;align-items:center;justify-content:space-between;padding:7px 14px 9px;">
      <button class="switch-link" id="toVoice">🎤 Byt till röst</button>
      <span>Powered by <strong>WidgetSell</strong></span>
    </div>
  </div>

</div>
<script>
  // ── Site data from host page ───────────────────────────────
  let siteData = null;
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'cw:sitedata') siteData = e.data.data;
  });

  // ── Screen switching ───────────────────────────────────────
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  document.getElementById('closeMode').addEventListener('click', () => window.parent.postMessage('cw:close', '*'));
  document.getElementById('closeVoice').addEventListener('click', () => { stopAll(); stopViz(); window.parent.postMessage('cw:close', '*'); });
  document.getElementById('closeChat').addEventListener('click', () => window.parent.postMessage('cw:close', '*'));

  document.getElementById('pickChat').addEventListener('click', () => { show('screen-chat'); initChat(); });
  document.getElementById('pickVoice').addEventListener('click', () => { show('screen-voice'); initVoice(); });
  document.getElementById('toChat').addEventListener('click', () => { stopAll(); stopViz(); show('screen-chat'); initChat(); });
  document.getElementById('toVoice').addEventListener('click', () => { show('screen-voice'); initVoiceFromChat(); });

  // ── Shared helpers ─────────────────────────────────────────
  async function ask(messages, mode = 'chat') {
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, siteData, mode }),
      });
      const reader = res.body.getReader(), dec = new TextDecoder();
      let full = '';
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        for (const line of dec.decode(value, { stream: true }).split('\n')) {
          if (!line.startsWith('data: ')) continue;
          const pl = line.slice(6); if (pl === '[DONE]') break;
          try { const { text } = JSON.parse(pl); if (text) full += text; } catch {}
        }
      }
      return full;
    } catch { return ''; }
  }

  function speak(text) {
    return new Promise(async resolve => {
      try {
        const r = await fetch('/api/tts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!r.ok) { resolve(); return; }
        const url = URL.createObjectURL(await r.blob());
        activeAudio = new Audio(url);
        activeAudio.play().catch(resolve);
        activeAudio.onended = () => { URL.revokeObjectURL(url); activeAudio = null; resolve(); };
        activeAudio.onerror = resolve;
      } catch { resolve(); }
    });
  }

  // ── Voice mode ─────────────────────────────────────────────
  const orbWrap      = document.getElementById('orbWrap');
  const orbBody      = document.getElementById('micBtn'); // orb IS the mic btn
  const micIcon      = document.getElementById('micIcon');
  const vStatusEl    = document.getElementById('vStatus');
  const transcriptEl = document.getElementById('transcript');
  const vHintEl      = document.getElementById('vHint');

  let vState = 'idle', vHistory = [];
  let mediaRecorder = null, micStream = null, activeAudio = null;
  let voiceInited = false, noSpeechStop = false;
  let voiceAnalyser = null, vizFrame = null;

  const LABELS = { idle: '', listening: 'Lyssnar', thinking: 'Tänker', speaking: 'Talar' };

  // Mic button is the orb body — remap old micBtn references
  const micBtn = {
    get disabled() { return orbBody.dataset.disabled === '1'; },
    set disabled(v) {
      orbBody.dataset.disabled = v ? '1' : '0';
      orbBody.style.cursor = v ? 'default' : 'pointer';
      orbBody.style.pointerEvents = v ? 'none' : '';
    },
    classList: { toggle(cls, val) { orbWrap.classList.toggle(cls, val); } }
  };

  function setVState(s) {
    vState = s;
    orbWrap.className = 'orb-wrap' + (s === 'speaking' || s === 'listening' || s === 'thinking' ? ' ' + s : '');
    micBtn.disabled = (s === 'thinking' || s === 'speaking');
    micIcon.style.opacity = (s === 'listening' || s === 'speaking' || s === 'thinking') ? '0' : '0.85';
    vStatusEl.textContent = LABELS[s] || '';
    vStatusEl.className = 'v-status' + (s !== 'idle' ? ' ' + s : '');
    vHintEl.textContent = s === 'listening' ? 'Tyst i 3 sek → skickas' : '';
  }

  // ── Canvas visualization ────────────────────────────────────
  function startViz() {
    const canvas = document.getElementById('waveCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;

    if (vizFrame) cancelAnimationFrame(vizFrame);

    function draw() {
      vizFrame = requestAnimationFrame(draw);
      ctx.clearRect(0, 0, W, H);

      if (vState === 'listening' && voiceAnalyser) {
        const td = new Float32Array(voiceAnalyser.fftSize);
        voiceAnalyser.getFloatTimeDomainData(td);
        const segs = 90, baseR = 32, boost = 26;
        ctx.beginPath();
        for (let i = 0; i <= segs; i++) {
          const angle = (i / segs) * Math.PI * 2 - Math.PI / 2;
          const amp = Math.abs(td[Math.floor((i / segs) * td.length)]);
          const r = baseR + amp * boost * 3;
          const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(255,255,255,.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.06)';
        ctx.fill();

      } else if (vState === 'speaking') {
        const t = Date.now() / 1000;
        const bars = 18, bw = 2.5, gap = (W * .72 - bars * bw) / (bars - 1), sx = W * .14;
        ctx.fillStyle = 'rgba(255,255,255,.65)';
        for (let i = 0; i < bars; i++) {
          const h = 5 + Math.abs(Math.sin(t * 4.5 + i * .55)) * 20 + Math.abs(Math.sin(t * 8 + i * 1.2)) * 8;
          const x = sx + i * (bw + gap);
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(x, cy - h / 2, bw, h, 1) : ctx.rect(x, cy - h / 2, bw, h);
          ctx.fill();
        }

      } else if (vState === 'thinking') {
        const t = Date.now() / 1000;
        for (let i = 0; i < 3; i++) {
          const bounce = Math.abs(Math.sin(t * 2.8 + i * 1.1));
          ctx.beginPath();
          ctx.arc(cx - 12 + i * 12, cy + Math.sin(t * 2.8 + i * 1.1) * 5, 3 + bounce * 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${.35 + bounce * .55})`;
          ctx.fill();
        }
      }
    }
    draw();
  }

  function stopViz() {
    if (vizFrame) { cancelAnimationFrame(vizFrame); vizFrame = null; }
    const canvas = document.getElementById('waveCanvas');
    if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  }

  // Orb click = mic toggle
  orbBody.addEventListener('click', () => {
    if (micBtn.disabled) return;
    if (vState === 'listening') { stopRecording(); return; }
    if (vState === 'idle') startRecording(false);
  });

  function addVLine(text, role) {
    let el;
    if (role === 'bot') {
      el = document.createElement('div');
      el.className = 'row bot';
      el.innerHTML = '<div class="row-av"><img src="/victoria.jpg" alt="Victoria"></div><div class="bubble"></div>';
      el.querySelector('.bubble').textContent = text;
    } else {
      el = document.createElement('div');
      el.className = 't-line user';
      el.textContent = text;
    }
    transcriptEl.appendChild(el);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  async function streamToBotLine(messages) {
    let row = null, bubbleEl = null, full = '';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, siteData, mode: 'voice' }),
      });
      const reader = res.body.getReader(), dec = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        for (const line of dec.decode(value, { stream: true }).split('\n')) {
          if (!line.startsWith('data: ')) continue;
          const pl = line.slice(6); if (pl === '[DONE]') break;
          try {
            const { text } = JSON.parse(pl);
            if (text) {
              if (!row) {
                row = document.createElement('div');
                row.className = 'row bot';
                row.innerHTML = '<div class="row-av"><img src="/victoria.jpg" alt="Victoria"></div><div class="bubble"></div>';
                bubbleEl = row.querySelector('.bubble');
                transcriptEl.appendChild(row);
              }
              full += text; bubbleEl.textContent = full; transcriptEl.scrollTop = transcriptEl.scrollHeight;
            }
          } catch {}
        }
      }
    } catch {}
    return full;
  }

  async function transcribe(blob) {
    try {
      const r = await fetch('/api/stt', {
        method: 'POST', headers: { 'Content-Type': blob.type || 'audio/wav' }, body: blob,
      });
      return ((await r.json()).text || '').trim();
    } catch { return ''; }
  }

  // Konverterar Float32Array (16 kHz mono) → WAV Blob
  function float32ToWav(samples, sampleRate = 16000) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buf);
    const w = (o, s) => s.split('').forEach((c, i) => view.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
    w(8, 'WAVE'); w(12, 'fmt '); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    w(36, 'data'); view.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }

  async function startRecording(auto = false) {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 16000 }
      });
    } catch { vStatusEl.textContent = 'Mikrofonåtkomst nekad'; return; }

    noSpeechStop = false;

    // ── Ljudbehandlingskedja ───────────────────────────────
    const audioCtx = new AudioContext({ sampleRate: 16000 });
    const source   = audioCtx.createMediaStreamSource(micStream);

    // Bandpass: isolera röstfrekvenser (80 Hz – 3 400 Hz)
    const hpf = audioCtx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 80;
    const lpf = audioCtx.createBiquadFilter(); lpf.type = 'lowpass';  lpf.frequency.value = 3400;

    // Inspelning sker på det filtrerade ljudet
    const dest = audioCtx.createMediaStreamDestination();
    source.connect(hpf); hpf.connect(lpf); lpf.connect(dest);

    // Analyser för VAD (kopplas efter filter)
    const an = audioCtx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.3;
    lpf.connect(an);

    // Spara filtrerade samplingar för WAV-konvertering
    const allSamples = [];
    const proc = audioCtx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = e => { if (vState === 'listening') allSamples.push(...e.inputBuffer.getChannelData(0)); };
    lpf.connect(proc); proc.connect(audioCtx.destination);

    voiceAnalyser = an;
    setVState('listening');
    startViz();
    vadWatch(auto, audioCtx, an, allSamples);

    // stopRecording stänger AudioContext och triggar onDone
    mediaRecorder = {
      stop: () => {
        proc.disconnect(); source.disconnect();
        micStream.getTracks().forEach(t => t.stop());
        audioCtx.close().catch(() => {});
        onDone(new Float32Array(allSamples));
      }
    };
  }

  function stopRecording() {
    if (mediaRecorder?.stop && vState === 'listening') mediaRecorder.stop();
  }

  // Adaptiv VAD — mäter RMS och kalibrerar brusgrund automatiskt
  function vadWatch(auto, audioCtx, an, allSamples) {
    let silenceTimer = null, noSpeechTimer = null, hasSpoken = false, tick = null;
    let noiseFloor = null;
    const td = new Float32Array(an.fftSize);

    tick = setInterval(() => {
      if (vState !== 'listening') {
        clearInterval(tick);
        if (silenceTimer) clearTimeout(silenceTimer);
        if (noSpeechTimer) clearTimeout(noSpeechTimer);
        return;
      }

      an.getFloatTimeDomainData(td);
      let sum = 0; for (let i = 0; i < td.length; i++) sum += td[i] * td[i];
      const rms = Math.sqrt(sum / td.length);

      // Kalibrera brusgrund
      if (noiseFloor === null) { noiseFloor = rms; return; }
      if (rms < noiseFloor * 2.5) noiseFloor = noiseFloor * 0.97 + rms * 0.03;

      // Röst detekteras om RMS är 3× över brusgrund och minst 0.008
      const isVoice = rms > Math.max(noiseFloor * 3, 0.008);

      if (isVoice) {
        hasSpoken = true;
        if (noSpeechTimer) { clearTimeout(noSpeechTimer); noSpeechTimer = null; }
        if (silenceTimer)  { clearTimeout(silenceTimer);  silenceTimer  = null; }
      } else if (hasSpoken && !silenceTimer) {
        silenceTimer = setTimeout(() => {
          clearInterval(tick);
          if (vState === 'listening') stopRecording();
        }, 3000);
      }
    }, 50);

    // Auto-läge: inget tal på 5 sek → gå tillbaka tyst
    if (auto) {
      noSpeechTimer = setTimeout(() => {
        if (!hasSpoken && vState === 'listening') {
          noSpeechStop = true; clearInterval(tick); stopRecording();
        }
      }, 5000);
    }
  }

  async function onDone(samples) {
    if (noSpeechStop) { noSpeechStop = false; setVState('idle'); return; }
    setVState('thinking');
    const wavBlob = float32ToWav(samples);
    const transcript = await transcribe(wavBlob);
    if (!transcript) { setVState('idle'); return; }
    addVLine(transcript, 'user');
    vHistory.push({ role: 'user', content: transcript });
    const reply = await streamToBotLine(vHistory);
    if (reply) {
      vHistory.push({ role: 'assistant', content: reply });
      setVState('speaking');
      await speak(reply);
      startRecording(true);
    } else {
      setVState('idle');
    }
  }

  function stopAll() {
    if (vState === 'listening') stopRecording();
    if (activeAudio) { activeAudio.pause(); activeAudio = null; }
    if (vState !== 'idle') setVState('idle');
  }

  async function initVoice() {
    if (voiceInited) return; voiceInited = true;
    startViz();
    const reply = await streamToBotLine([{ role: 'user', content: 'hej' }]);
    if (reply) {
      vHistory.push({ role: 'user', content: 'hej' });
      vHistory.push({ role: 'assistant', content: reply });
      setVState('speaking');
      await speak(reply);
      startRecording(true);
    } else {
      setVState('idle');
    }
  }

  async function initVoiceFromChat() {
    if (voiceInited) { setVState('idle'); startViz(); return; }
    voiceInited = true;
    startViz();
    // Reuse chat history if conversation already started
    if (chatHistory.length >= 2) {
      vHistory = [...chatHistory];
      setVState('idle');
      return;
    }
    const reply = await streamToBotLine([{ role: 'user', content: 'hej' }]);
    if (reply) {
      vHistory.push({ role: 'user', content: 'hej' });
      vHistory.push({ role: 'assistant', content: reply });
      setVState('speaking');
      await speak(reply);
      startRecording(true);
    } else {
      setVState('idle');
    }
  }

  // ── Chat mode ──────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');
  const chatInput  = document.getElementById('chatInput');
  const sendBtn    = document.getElementById('sendBtn');
  let chatHistory = [], chatBusy = false, chatInited = false;

  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addUserBubble(text) {
    const row = document.createElement('div'); row.className = 'row user';
    const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
    row.appendChild(b); messagesEl.appendChild(row); scrollBottom();
  }

  function showTyping() {
    const row = document.createElement('div'); row.className = 'typing-row'; row.id = 'typing';
    row.innerHTML = `<div class="row-av"><img src="/victoria.jpg" alt="Victoria"></div><div class="typing-bubble"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(row); scrollBottom();
  }

  function removeTyping() { document.getElementById('typing')?.remove(); }

  function newBotBubble() {
    const row = document.createElement('div'); row.className = 'row bot';
    const av = document.createElement('div'); av.className = 'row-av'; av.innerHTML = '<img src="/victoria.jpg" alt="Victoria">';
    const b = document.createElement('div'); b.className = 'bubble';
    row.appendChild(av); row.appendChild(b); messagesEl.appendChild(row); scrollBottom();
    return b;
  }

  async function fetchChat(messages) {
    showTyping();
    let bubble = null, fullText = '';
    try {
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages, siteData, mode: 'chat' }) });
      const reader = res.body.getReader(), dec = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        for (const line of dec.decode(value, { stream: true }).split('\n')) {
          if (!line.startsWith('data: ')) continue;
          const pl = line.slice(6); if (pl === '[DONE]') break;
          try {
            const { text, error } = JSON.parse(pl);
            if (error) throw new Error(error);
            if (text) { if (!bubble) { removeTyping(); bubble = newBotBubble(); } fullText += text; bubble.textContent = fullText; scrollBottom(); }
          } catch(e) { removeTyping(); if (!bubble) bubble = newBotBubble(); bubble.textContent = e.message || 'Något gick fel.'; return ''; }
        }
      }
    } catch { removeTyping(); if (!bubble) bubble = newBotBubble(); bubble.textContent = 'Anslutningsfel.'; return ''; }
    removeTyping();
    return fullText;
  }

  async function sendChat(text) {
    if (chatBusy) return; chatBusy = true; sendBtn.disabled = true;
    chatHistory.push({ role: 'user', content: text });
    const bot = await fetchChat(chatHistory);
    if (bot) chatHistory.push({ role: 'assistant', content: bot });
    chatBusy = false; sendBtn.disabled = !chatInput.value.trim(); chatInput.focus();
  }

  sendBtn.addEventListener('click', () => {
    const t = chatInput.value.trim(); if (!t) return;
    chatInput.value = ''; sendBtn.disabled = true; addUserBubble(t); sendChat(t);
  });
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
  chatInput.addEventListener('input', () => { sendBtn.disabled = !chatInput.value.trim() || chatBusy; });

  async function initChat() {
    if (chatInited) return; chatInited = true; chatBusy = true;
    // Om rösthistorik finns — fortsätt konversationen i chat utan ny hälsning
    if (vHistory.length >= 2) {
      chatHistory = [...vHistory];
      chatBusy = false; sendBtn.disabled = !chatInput.value.trim(); chatInput.focus();
      return;
    }
    const g = await fetchChat([{ role: 'user', content: 'hej' }]);
    chatHistory = [{ role: 'user', content: 'hej' }];
    if (g) chatHistory.push({ role: 'assistant', content: g });
    chatBusy = false; sendBtn.disabled = !chatInput.value.trim(); chatInput.focus();
  }
</script>
</body>
